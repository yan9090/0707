<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#fbe8ed">
<title>Для тебя 💗</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap');

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#180e12}
body{
  font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  color:#2d151e;
}
.app{
  width:100%;height:100dvh;overflow:hidden;position:relative;
  background:radial-gradient(circle at 50% 20%, #ffedf2 0%, #fbd5e0 55%, #f7b7c9 100%);
}
.track{height:100%;transition:transform .75s cubic-bezier(.16,1,.3,1);will-change:transform}
.slide{
  height:100dvh;width:100%;display:flex;align-items:center;justify-content:center;
  padding:50px 24px 36px;position:relative;overflow:hidden;
}
.content{
  width:min(100%,380px);position:relative;z-index:2;text-align:center;
  display:flex;flex-direction:column;align-items:center;
}
.photo-wrapper{
  position:relative;width:min(100%,300px);height:min(44dvh,360px);
  margin-bottom:20px;
}
.photo-wrapper::before{
  content:'';position:absolute;inset:-4px;
  background:linear-gradient(135deg,rgba(255,255,255,.9),rgba(255,255,255,.2));
  border-radius:28px;z-index:0;
}
.photo{
  position:relative;z-index:1;width:100%;height:100%;object-fit:cover;
  display:block;border-radius:26px;
  box-shadow:0 20px 40px -10px rgba(130,35,65,.25),0 8px 16px -6px rgba(0,0,0,.1);
}
.eyebrow{
  display:inline-flex;align-items:center;gap:6px;
  font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  color:#b84260;background:rgba(255,255,255,.65);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  padding:6px 14px;border-radius:99px;margin-bottom:14px;
  border:1px solid rgba(255,255,255,.8);
  box-shadow:0 4px 12px rgba(0,0,0,.03);
}
h2{
  font-size:clamp(28px,7.8vw,38px);line-height:1.08;letter-spacing:-1.2px;
  margin:0;font-weight:800;color:#2a0e17;
  text-shadow:0 2px 10px rgba(255,255,255,.5);
}
p{
  font-size:15px;line-height:1.45;color:#6b404e;margin:10px auto 0;
  max-width:320px;font-weight:500;
}
.btn{
  border:0;width:min(100%,290px);margin-top:22px;padding:16px 24px;border-radius:99px;
  background:linear-gradient(135deg,#ff3b5c 0%,#e61e43 100%);
  color:white;font:800 15px/1.2 inherit;letter-spacing:-0.2px;
  box-shadow:0 12px 28px -6px rgba(230,30,67,.45),0 4px 10px rgba(0,0,0,.05);
  cursor:pointer;transition:transform .2s ease,box-shadow .2s ease;
  position:relative;overflow:hidden;
}
.btn:active{transform:scale(.95);box-shadow:0 6px 16px -4px rgba(230,30,67,.4)}

/* Header Controls */
.header-bar{
  position:fixed;top:max(16px,env(safe-area-inset-top));left:0;right:0;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;z-index:20;pointer-events:none;
}
.progress{
  display:flex;gap:4px;background:rgba(255,255,255,.4);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  padding:5px;border-radius:99px;border:1px solid rgba(255,255,255,.5);
}
.dot{height:4px;width:6px;border-radius:99px;background:rgba(180,80,110,.25);transition:all .3s ease}
.dot.active{width:20px;background:#ff2a52}

.counter{
  font-size:11px;font-weight:800;color:#9e4b61;
  background:rgba(255,255,255,.5);backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  padding:4px 10px;border-radius:99px;border:1px solid rgba(255,255,255,.6);
}

/* Decor Elements */
.decor{position:absolute;inset:0;pointer-events:none;z-index:1}
.decor i{position:absolute;font-style:normal;user-select:none;animation:float 5s ease-in-out infinite}
.d1{left:7%;top:16%;font-size:22px;opacity:.35;animation-delay:0s}
.d2{right:8%;top:28%;font-size:16px;opacity:.25;animation-delay:1.2s}
.d3{left:9%;bottom:16%;font-size:18px;opacity:.3;animation-delay:2.4s}
.d4{right:10%;bottom:22%;font-size:24px;opacity:.35;animation-delay:.8s}

@keyframes float{
  0%,100%{transform:translateY(0) rotate(0deg)}
  50%{transform:translateY(-12px) rotate(10deg)}
}

/* Slide Transition Animations */
.slide .photo-wrapper, .slide h2, .slide p, .slide .btn {
  opacity:0;transform:translateY(20px);
  transition:opacity .6s ease, transform .6s cubic-bezier(.16,1,.3,1);
}
.slide.active .photo-wrapper{opacity:1;transform:translateY(0);transition-delay:.15s}
.slide.active h2{opacity:1;transform:translateY(0);transition-delay:.25s}
.slide.active p{opacity:1;transform:translateY(0);transition-delay:.32s}
.slide.active .btn{opacity:1;transform:translateY(0);transition-delay:.38s}

@media(min-width:600px){
  .app{width:390px;margin:20px auto;height:calc(100dvh - 40px);border-radius:36px;box-shadow:0 25px 70px rgba(0,0,0,.35)}
  .header-bar{position:absolute}
}
</style>
</head>
<body>
<div class="app">
 <div class="header-bar">
   <div class="progress" id="progress"></div>
   <div class="counter" id="counter"></div>
 </div>
 <div class="track" id="track"></div>
</div>

<script>
const pages = [
 ["photo-14.jpeg","Привет пупсик","У меня не получается передать то как сильно я по тебе скучаю и люблю тебя словами. Может у меня получится сделать это таким образом. Просто нажимай на кнопку и читай","Нажми на меня"],
 ["photo-12.jpeg","Бу","Испугались?","Нажимай не бойся"],
 ["photo-23.jpeg","Очень очень","Скучаю по тебе, ты мое солнышко — светишь каждый день","Тапай"],
 ["photo-27.jpeg","Хочу вот так","Тебя обнять и не пускать","Тыкай"],
 ["photo-26.jpeg","Да","Это очень сладко согласен)","Готова?"],
 ["photo-29.jpeg","Люблю тебя<br>Такую","","Дальше"],
 ["photo-25.jpeg","Такую","Люблю очень","Клац!"],
 ["photo-24.jpeg","И такую тоже","Люблю тебя абсолютно любую","Есть еще"],
 ["photo-06.jpeg","Скучаю по нашему","Отдыху, и хочу повторить это еще очень много раз","Гортай"],
 ["photo-28.jpeg","Мы взлетаем","Набираем обороты. Почти","Мы летим"],
 ["photo-22.jpeg","Мы летим","Хочу тебя встретить вот так","Почти почти"],
 ["photo-01.jpeg","Все еще летим","Мы покидаем орбиту земля, она меньше чем наша любовь","В стратосферу"],
 ["photo-21.jpeg","Мы на месте","Звезд не хватит пересчитать как я скучаю по тебе солнце","Есть еще"],
 ["photo-07.jpeg","Хочу тебя","Так сладко поцеловать","И еще...."],
 ["photo-19.jpeg","Раз поцеловать","Уже в губки. Цем","Дальше"],
 ["photo-17.jpeg","Спряталась","И выжидает. Хочу с тобой уже баловаться","Да Да"],
 ["photo-04.jpeg","Но я все равно","Поймал тебя ахахах","Чмок"],
 ["photo-16.jpeg","Еще чмок","Хочу тебя зацеловать всю. Так сильно скучаю","Дальше"],
 ["photo-09.jpeg","Моя леди","Ты мой дом. Без тебя тут грустно :((","Это так"],
 ["photo-10.jpeg","Моя радость","Мне с тобой очень весело","Тапай"],
 ["photo-18.jpeg","Любимая","Любое занятие с тобой интересное, я очень соскучился","Ну правда"],
 ["photo-13.jpeg","И морожено","Вкуснее с тобой","ММММ"],
 ["photo-20.jpeg","И пиво","Вкуснее с рядом тобой. Буль буль","Дальше"],
 ["photo-11.jpeg","И кофе","Имеет вкус любви, когда рядом Тыы","Люблю"],
 ["photo-15.jpeg","И море","Пахнет как сон, потому что там есть ты","Еще"],
 ["photo-05.jpeg","Еще","Ты самая красивая во вселенной. Я очень скучаю","Еще"],
 ["photo-08.jpeg","Я жду тебя","Каждый день. Даже когда не говорю это","Еще"],
 ["photo-03.jpeg","Любое время","Года теплое с тобой","И на конец"],
 ["photo-02.jpeg","Я очень жду тебя","Приезжай ко мне скорее котик","На этом все)"]
];

const track=document.getElementById('track');
const progress=document.getElementById('progress');
const counter=document.getElementById('counter');

pages.forEach((p,i)=>{
  const s=document.createElement('section'); 
  s.className='slide' + (i===0 ? ' active' : '');
  s.innerHTML=`<div class="decor"><i class="d1">🌸</i><i class="d2">💖</i><i class="d3">✨</i><i class="d4">💗</i></div>
  <div class="content">
    <div class="photo-wrapper">
      <img class="photo" src="${p[0]}" alt="Photo">
    </div>
    <div class="eyebrow">${i===0?'для тебя 💌':'ещё немного'}</div>
    <h2>${p[1]}</h2>
    ${p[2]?`<p>${p[2]}</p>`:''}
    <button class="btn">${p[3]}</button>
  </div>`;
  track.appendChild(s);
  const d=document.createElement('span'); d.className='dot'+(i===0?' active':''); progress.appendChild(d);
});

let current=0,locked=false;
function update(){
 track.style.transform=`translateY(-${current*100}dvh)`;
 [...progress.children].forEach((d,i)=>d.classList.toggle('active',i===current));
 [...track.children].forEach((s,i)=>s.classList.toggle('active',i===current));
 counter.textContent=`${current+1} / ${pages.length}`;
}

function next(){
  if(locked||current>=pages.length-1)return;
  locked=true;current++;update();
  setTimeout(()=>locked=false,750);
}

document.addEventListener('click',e=>{if(e.target.closest('.btn'))next()});
let y=0;
document.addEventListener('touchstart',e=>y=e.touches[0].clientY,{passive:true});
document.addEventListener('touchend',e=>{if(y-e.changedTouches[0].clientY>45)next()},{passive:true});
update();
</script>
</body>
</html>
